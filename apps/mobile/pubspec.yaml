name: construction_field_app
description: Construction Management Field App — offline-first field evidence OS (RAYNS MVP + mid-market differentiators).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  # 0.9.2 is the newest workmanager that supports Flutter 3.32 (0.9.3+ / 0.10
  # need Flutter >=3.38). Overrides keep apple/android/platform in sync — pub
  # otherwise picks android 0.9.3 + platform 0.9.4 while apple 0.9.4 lacks
  # foregroundServiceConfig and fails to compile on Linux/CI.
  workmanager: 0.9.2
  cloud_functions: ^6.3.6
  share_plus: ^12.0.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  # Still deferred:
  # firebase_crashlytics, firebase_analytics, drift, path_provider, pdfrx

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  workmanager_android: 0.9.2
  workmanager_apple: 0.9.4
  workmanager_platform_interface: 0.9.3

flutter:
  uses-material-design: true
  generate: true
