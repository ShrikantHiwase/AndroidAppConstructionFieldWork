publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  local_auth: ^2.3.0

  # Still deferred:
  # firebase_crashlytics, firebase_analytics, drift, path_provider,
  # workmanager, pdfrx

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
